name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare deploy secrets
        id: secrets_check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_DB_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && [ -n "$CF_DB_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy secrets are not configured yet; skipping deploy."
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets_check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.secrets_check.outputs.ready == 'true'

      - name: Generate private wrangler.jsonc from GitHub Secrets
        if: steps.secrets_check.outputs.ready == 'true'
        env:
          CF_WORKER_NAME: ${{ secrets.CF_WORKER_NAME }}
          CF_D1_DATABASE_NAME: ${{ secrets.CF_D1_DATABASE_NAME }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
        run: |
          node -e "
            const fs = require('node:fs');
            const cfg = JSON.parse(fs.readFileSync('wrangler.example.jsonc', 'utf8'));
            if (process.env.CF_WORKER_NAME) cfg.name = process.env.CF_WORKER_NAME;
            if (process.env.CF_D1_DATABASE_NAME) cfg.d1_databases[0].database_name = process.env.CF_D1_DATABASE_NAME;
            cfg.d1_databases[0].database_id = process.env.CF_D1_DATABASE_ID;
            fs.writeFileSync('wrangler.jsonc', JSON.stringify(cfg, null, 2));
          "

      - name: Apply D1 migrations
        if: steps.secrets_check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Build and Deploy Worker
        if: steps.secrets_check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
